name: v1.0.2 Windows installation acceptance
on:
  push:
    branches: ['codex/v1.0.2-acceptance']

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-2025
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24.16.0'
      - name: Install locked dependencies
        shell: pwsh
        working-directory: nagisa-app
        run: |
          npm.cmd ci --no-audit --no-fund 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/nagisa-npm.log"
          $code=$LASTEXITCODE
          if ($code) {
            Get-Content -LiteralPath "$env:RUNNER_TEMP/nagisa-npm.log" -Tail 12 | ForEach-Object { Write-Host "::error title=npm ci::$($_ -replace '%','%25')" }
            exit $code
          }
      - name: Typecheck
        shell: pwsh
        working-directory: nagisa-app
        run: |
          npm.cmd run typecheck
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Build full Windows Setup
        env:
          CI: 'true'
        shell: pwsh
        working-directory: nagisa-app
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $log = "$env:RUNNER_TEMP/nagisa-build.log"
          try {
            $env:NAGISA_ELECTRON_ZIP_DIR = (New-Item -ItemType Directory -Path "$env:RUNNER_TEMP/nagisa-runtime").FullName
            $version = (Get-Content -LiteralPath 'node_modules/electron/package.json' -Raw | ConvertFrom-Json).version
            $runtimeName = "electron-v${version}-win32-x64.zip"
            $upstream = "https://github.com/electron/electron/releases/download/v$version"
            $runtime = Join-Path $env:NAGISA_ELECTRON_ZIP_DIR $runtimeName
            $checksums = Join-Path $env:NAGISA_ELECTRON_ZIP_DIR 'SHASUMS256.txt'
            curl.exe --fail --location --retry 3 --silent --show-error "$upstream/$runtimeName" -o $runtime
            if ($LASTEXITCODE) { throw 'Could not download the official Electron runtime.' }
            curl.exe --fail --location --retry 3 --silent --show-error "$upstream/SHASUMS256.txt" -o $checksums
            if ($LASTEXITCODE) { throw 'Could not get the Electron SHA-256 manifest.' }
            $manifest = Get-Content -LiteralPath $checksums | Where-Object { $_.EndsWith(' *'+$runtimeName) -or $_.EndsWith(' '+$runtimeName) } | Select-Object -First 1
            if(!$manifest -or (($manifest -split '\s+')[0] -ne (Get-FileHash -LiteralPath $runtime -Algorithm SHA256).Hash)) { throw 'Official Electron ZIP digest mismatch.' }
            $env:NAGISA_FORGE_EXTRACT_MODULE = (Resolve-Path -LiteralPath 'node_modules/@electron/packager/dist/unzip.js').Path
            $hook = (Resolve-Path -LiteralPath '../.github/acceptance/forge-extract.cjs').Path
            $env:NODE_OPTIONS = '--require=' + $hook.Replace('\','/')
            npm.cmd run make -- --platform=win32 --arch=x64 2>&1 | Tee-Object -FilePath $log
            if ($LASTEXITCODE) { throw "Forge exited with $LASTEXITCODE." }
            $qa = New-Item -ItemType Directory -Path "$env:RUNNER_TEMP/nagisa-acceptance"
            $setup = Join-Path $qa.FullName 'Nagisa-Desktop-Pet-1.0.2-win-x64-Setup.exe'
            Copy-Item -LiteralPath 'out/make/squirrel.windows/x64/Nagisa Desktop Pet-1.0.2 Setup.exe' -Destination $setup
            Get-Item -LiteralPath $setup | Select-Object Name,Length | Format-List
            Get-FileHash -LiteralPath $setup -Algorithm SHA256 | Format-List
            Write-Host "::notice title=Setup identity::$((Get-Item -LiteralPath $setup).Length) bytes | $((Get-FileHash -LiteralPath $setup -Algorithm SHA256).Hash)"
          } catch {
            Write-Host "::error title=Build error::$($_.Exception.Message)"
            if(Test-Path -LiteralPath $log) {
              (Get-Content -LiteralPath $log -Tail 15) | ForEach-Object { Write-Host "::error title=Forge::$($_ -replace '%','%25')" }
            }
            throw
          }
      - uses: actions/upload-artifact@v4
        with:
          name: v1.0.2-windows-setup
          path: ${{ runner.temp }}/nagisa-acceptance/Nagisa-Desktop-Pet-1.0.2-win-x64-Setup.exe
          compression-level: 0
          retention-days: 5
      - name: Fetch both historical portable releases
        shell: pwsh
        run: |
          $qa = "$env:RUNNER_TEMP/nagisa-acceptance"
          foreach ($version in '1.0.0','1.0.1') {
            $zip = Join-Path $qa "$version.zip"
            $url = "https://github.com/WMXhy/Desktop-pet-of-Nagisa-Furukawa/releases/download/v$version/Nagisa-Desktop-Pet-$version-win-x64.zip"
            curl.exe --fail --location --retry 3 --silent --show-error $url -o $zip
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            $extract = New-Item -ItemType Directory -Path (Join-Path $qa "portable-$version")
            & "$env:SystemRoot/System32/tar.exe" -xf $zip -C $extract.FullName
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
      - name: Build an internal 1.0.0 installer from the published app
        shell: pwsh
        working-directory: nagisa-app
        run: |
          $env:NAGISA_QA_ROOT = "$env:RUNNER_TEMP/nagisa-acceptance"
          @'
          const path = require('node:path');
          const { createWindowsInstaller } = require('electron-winstaller');
          const root = process.env.NAGISA_QA_ROOT;
          createWindowsInstaller({
            appDirectory: path.join(root, 'portable-1.0.0'),
            outputDirectory: path.join(root, 'internal-1.0.0'),
            name: 'nagisa_app', title: 'Nagisa Desktop Pet', authors: 'WMXhy', version: '1.0.0',
            description: 'Nagisa Desktop Pet', exe: 'Nagisa Desktop Pet.exe',
            setupExe: 'internal-1.0.0.exe', noMsi: true,
          }).catch(error => { console.error(error); process.exitCode = 1; });
          '@ | node.exe -
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Exercise Setup and legacy migrations with a clean Windows profile
        shell: pwsh
        run: |
          $qa = "$env:RUNNER_TEMP/nagisa-acceptance"
          try {
            & .github/acceptance/verify-windows.ps1 -Setup "$qa/Nagisa-Desktop-Pet-1.0.2-win-x64-Setup.exe" -Baseline "$qa/internal-1.0.0/internal-1.0.0.exe" -Portable100 "$qa/portable-1.0.0" -Portable101 "$qa/portable-1.0.1"
          } catch {
            Write-Host "::error title=Windows test::$($_.Exception.Message)"
            foreach($source in "$env:LOCALAPPDATA/nagisa_app/SquirrelSetup.log","$env:LOCALAPPDATA/SquirrelTemp/SquirrelSetup.log") {
              if(Test-Path -LiteralPath $source) {
                Get-Content -LiteralPath $source -Tail 9 | ForEach-Object { Write-Host "::warning title=Squirrel::$($_ -replace '%','%25')" }
              }
            }
            throw
          }
